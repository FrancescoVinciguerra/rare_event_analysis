[project]
name = "rea-of-llms-supplementary-code"
version = "0.1.0"
description = "Suffix direct-MH SMC for rare language-model completions and SNIS tail estimation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "pytest>=8.0",
    "textstat>=0.7.3",
    "torch>=2.3",
    "tqdm>=4.66",
    "transformers>=4.40",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
