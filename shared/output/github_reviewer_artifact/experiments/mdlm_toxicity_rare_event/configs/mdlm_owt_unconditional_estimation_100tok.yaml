extends: mdlm_owt_unconditional_common.yaml

decoder:
  denoising_steps: 32

evaluation:
  reward:
    definition: log_softmax_probability_of_positive_toxicity_class
    text_scope: first_generated_mdlm_tokens_only
    completion_tokens: 100
    classifier_max_length: 512
  event:
    definition: classifier_argmax_equals_positive_label_index
    text_scope: first_generated_mdlm_tokens_only
    completion_tokens: 100
    classifier_max_length: 512

smc:
  experiment_phase: estimation
  tilted_lambdas: [0.25, 0.5, 0.75, 1.0]
  tilted_component_weights_a: [0.25, 0.25, 0.25, 0.25]
  component_weight_policy: uniform
  optimize_component_weights: false
  diagnostic_lambdas: []
  num_particles: 512
  independent_runs: 1
  num_independent_runs: 1
  reward_frequency: 4
  reward_interval: 4
  resampling_method: systematic
  ess_threshold: 0.5
  microbatch_size: 16
  base_seed: 67000
  component_rng_policy: independent_seed_per_run_and_component
  beta_start_fraction: 0.0
  final_resampling: false
