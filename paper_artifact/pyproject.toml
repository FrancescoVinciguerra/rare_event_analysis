[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdlm-paper-artifact"
version = "0.1.0rc1"
description = "Frozen RollBack–SMC and crude Monte Carlo reproduction artifact"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "Pillow>=10",
    "PyYAML>=6",
    "torch>=2.6",
    "transformers==4.57.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["diffusion_toxicity_smc_experiment"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
